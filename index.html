<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c38"><title>Crab Attack</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}body{background:#102c38;color:#fff5d9;font-family:system-ui,sans-serif;display:grid;place-items:center}main{position:relative;width:min(100vw,460px);height:100dvh;max-height:900px;overflow:hidden;background:#f0d19b;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:absolute;left:18px;right:18px;top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;color:#fff8e2;pointer-events:none}.brand{font-weight:950;letter-spacing:-1px;font-size:22px;line-height:.95}.brand span{color:#ffb772}.numbers{text-align:right;font-size:13px;font-weight:750}.numbers strong{display:block;font-size:23px}#pause{pointer-events:auto;border:1px solid #ffffff45;background:#123747;color:#fff;padding:10px 13px;border-radius:12px;font:700 16px system-ui;min-width:44px;min-height:44px}.overlay{position:absolute;inset:0;background:#102c38df;display:grid;place-content:center;text-align:center;padding:30px;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.icon{font-size:65px}h1{font-size:46px;line-height:1;letter-spacing:-2px;margin:18px 0;color:#ffbd84}p{font-size:18px;line-height:1.55;max-width:310px;margin:0 auto 25px;color:#fff0d4}button.primary{background:#ffb16f;border:0;border-bottom:5px solid #cc7753;border-radius:18px;padding:19px 26px;color:#19343d;font:bold 20px system-ui;min-height:64px;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}.note{font-size:12px;opacity:.7;margin-top:18px}.tip{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));width:100%;text-align:center;color:#624c39;font-size:13px;font-weight:750;pointer-events:none}#announcement{position:absolute;top:100px;width:100%;text-align:center;color:#194854;font-size:14px;font-weight:800;pointer-events:none}@media(max-height:570px){h1{font-size:34px}.icon{font-size:40px}p{font-size:15px;margin-bottom:14px}.overlay{padding:20px}}
</style><main><canvas id="game" width="420" height="760" aria-label="Tap the crabs to shoo them away from your sandcastle"></canvas><div class="hud"><div class="brand">CRAB<br><span>ATTACK</span></div><div class="numbers"><span id="round">ROUND 1 / 8</span><strong id="score">0</strong></div><button id="pause" aria-label="Pause game">Ⅱ</button></div><div id="announcement"></div><div class="tip" id="tip">Tap crabs. Save your castle.</div><div class="overlay" id="overlay"><div class="icon" id="icon">🦀</div><h1 id="title">Save your<br>sandcastle.</h1><p id="description">Tap crabs to shoo them away.<br>Don’t let them reach your castle!</p><button class="primary" id="action">Let’s play</button><div class="note" id="note">No shooting. Just a beach towel.</div></div></main><script>
'use strict';
const $=s=>document.querySelector(s),canvas=$('#game'),g=canvas.getContext('2d');
const rounds=['Beach day','Incoming tide','Both sides','Crab parade','Diving crabs','Beach crossing','Crab train','Last tide'];
let state='ready',round=1,score=0,health=3,castle=1,crabs=[],particles=[],swats=[],elapsed=0,spawnClock=.7,spawned=0,clock=0,last=0,best=0,noticeTime=0,pausedFrom='playing';
try{best=Number(localStorage.getItem('crabAttackPhoneBest'))||0}catch{}
function ui(){$('#round').textContent='ROUND '+round+' / 8';$('#score').textContent=score;$('#pause').hidden=state!=='playing'&&state!=='paused';$('#announcement').textContent=noticeTime>0?rounds[round-1]+' · '+(round===2||round===6?'water speeds crabs up!':'tap the crabs!'):''}
function show(title,description,label,icon='🏰'){ $('#title').textContent=title;$('#description').textContent=description;$('#action').textContent=label;$('#icon').textContent=icon;$('#overlay').classList.remove('hidden');ui()}
function begin(){state='playing';crabs=[];particles=[];swats=[];elapsed=0;spawnClock=.9;spawned=0;noticeTime=3;$('#overlay').classList.add('hidden');$('#tip').textContent='Tap crabs to shoo them away';ui()}
function reset(){round=1;score=0;health=3;castle=1;begin()}
function finish(win){state=win?'won':'lost';best=Math.max(best,score);try{localStorage.setItem('crabAttackPhoneBest',best)}catch{}show(win?'Beach saved!':'Oh, crumbs!',win?'Your sandcastle survived all eight rounds. '+score+' points!':'The crabs got your castle. You scored '+score+'.', 'Play again',win?'🏰':'🦀');$('#note').textContent='Best score: '+best}
function clearRound(){if(round===8){finish(true);return}state='between';show('Nice work!','Build your castle higher and restore its three hearts.','Build & next round');$('#note').textContent='Round '+round+' complete · '+score+' points'}
$('#action').onclick=()=>{if(state==='paused'){state=pausedFrom;$('#overlay').classList.add('hidden');ui()}else if(state==='between'){castle++;round++;health=3;begin()}else reset()};
function pause(){if(state!=='playing')return;pausedFrom=state;state='paused';show('Beach break','The crabs can wait.','Keep playing','☀️');$('#note').textContent=''}$('#pause').onclick=()=>state==='paused'?$('#action').click():pause();addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function spawn(){const i=spawned++,side=i%2?-1:1;let x=35+Math.random()*350,y=140;if(round===3){x=side<0?15:405;y=190+Math.random()*150}if(round===4)x=45+i%5*82;if(round===7)x=210;crabs.push({x,y,startX:x,t:0,phase:i*.8,speed:37+round*4,away:false,wet:false,side,dead:false})}
function burst(x,y){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:.4})}
function tap(x,y){if(state!=='playing')return;swats.push({x,y,life:.25});const targets=crabs.filter(c=>!c.away&&!c.dead&&Math.hypot(c.x-x,c.y-y)<43).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y));if(targets.length){const c=targets[0];c.away=true;score+=10;burst(c.x,c.y);ui()}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();tap((e.clientX-r.left)*420/r.width,(e.clientY-r.top)*760/r.height)});
function update(dt){if(state!=='playing')return;clock+=dt;elapsed+=dt;noticeTime=Math.max(0,noticeTime-dt);spawnClock-=dt;const total=7+round;if(spawned<total&&spawnClock<=0){spawn();spawnClock=Math.max(.65,1.3-round*.065)}for(const c of crabs){c.t+=dt;if(c.away){c.y-=340*dt;c.x+=c.side*100*dt;if(c.y<90||c.x<-40||c.x>460)c.dead=true;continue}c.wet=(round===2||round===6)&&c.y>305&&c.y<405;let speed=c.speed*(c.wet?2:1);if(round===5&&c.y>320)speed*=1.3;c.y+=speed*dt;if(round===1)c.x=c.startX+Math.sin(c.t*2+c.phase)*20;if(round===3)c.x+=(210-c.x)*dt*.35;if(round===4)c.x=c.startX+Math.sin(elapsed*1.4)*22;if(round===5)c.x+=(210-c.x)*dt*.6;if(round===6)c.x=c.startX+Math.sin(c.t*3)*24;if(round===7)c.x=210+Math.sin(c.t*1.8)*125;if(round===8)c.x=c.startX+Math.sin(c.t*2.5+c.phase)*25;c.x=Math.max(24,Math.min(396,c.x));if(c.y>610){c.dead=true;health--;burst(c.x,c.y);if(health<=0){finish(false);break}}}crabs=crabs.filter(c=>!c.dead);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);swats.forEach(s=>s.life-=dt);swats=swats.filter(s=>s.life>0);if(state==='playing'&&spawned>=total&&!crabs.length)clearRound();ui()}
function box(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}
const sprite=['100000001','110000011','011111110','110101011','111111111','001111100','011000110','110000011'];
function drawCrab(c){const size=4;g.save();g.translate(c.x,c.y);g.rotate(Math.sin(c.t*10)*.08);for(let r=0;r<8;r++)for(let col=0;col<9;col++)if(sprite[r][col]==='1')box(col*size-18,r*size-16,size,size,c.away?'#399c91':c.wet?'#388bb7':'#e96346');box(-9,-6,4,4,'#fff9d8');box(7,-6,4,4,'#fff9d8');g.restore()}
function draw(){box(0,0,420,760,'#f0d19b');box(0,0,420,122,'#164756');g.fillStyle='#3b979f';g.beginPath();g.moveTo(0,100);g.lineTo(420,100);for(let x=420;x>=0;x-=10)g.lineTo(x,132+Math.sin(x/45+clock)*5);g.closePath();g.fill();g.strokeStyle='#cee9d1';g.lineWidth=5;g.beginPath();for(let x=0;x<=420;x+=10)g.lineTo(x,141+Math.sin(x/45+clock)*5);g.stroke();for(let i=0;i<90;i++)box(i*137%420,160+i*73%550,2,2,'#d3b781');if(round===2||round===6){box(0,305,420,100,'#80c4c778');g.fillStyle='#397784';g.font='bold 12px system-ui';g.textAlign='center';g.fillText('WET SAND · FASTER CRABS',210,358)}
g.strokeStyle='#bd93624a';g.setLineDash([5,8]);g.beginPath();g.moveTo(15,612);g.lineTo(405,612);g.stroke();g.setLineDash([]);const height=Math.min(4,castle)*10;for(const [x,w,h]of [[135,40,52+height],[175,70,40+height],[245,40,52+height]]){box(x,695-h,w,h,'#bd915b');box(x+4,699-h,w-8,h-8,'#dab273');for(let xx=x;xx<x+w;xx+=16)box(xx,689-h,10,10,'#d9b37a')}box(198,671,24,24,'#8c6845');box(208,610-height,3,44,'#947347');box(211,610-height,28,15,'#e97060');g.font='23px system-ui';g.textAlign='center';g.fillStyle='#c96855';g.fillText('♥ '.repeat(Math.max(0,health)).trim(),210,730);g.font='12px system-ui';g.fillStyle='#8c704e';g.fillText('🏖',45,650);g.fillText('🐚',365,680);for(const c of crabs)drawCrab(c);for(const p of particles){g.globalAlpha=p.life/.4;box(p.x,p.y,4,4,'#fff8df')}g.globalAlpha=1;for(const s of swats){g.save();g.translate(s.x,s.y);g.rotate(-.4);g.globalAlpha=s.life/.25;box(-24,-10,48,20,'#53bab0');for(let x=-20;x<24;x+=12)box(x,-10,5,20,'#fff1ca');g.restore()}}
function frame(now){const dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();requestAnimationFrame(frame)}ui();requestAnimationFrame(frame);
</script></html>
