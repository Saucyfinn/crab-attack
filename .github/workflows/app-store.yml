# Archives the iOS app on a GitHub-hosted Mac, signs it with cloud-managed certificates and uploads it to
# App Store Connect, so a release needs no Mac of your own. Runs on every push to main that changes the game
# or the iOS app, or by hand from the Actions tab (Run workflow). Once Apple has processed the build, it is added to
# a TestFlight internal testing group ("Internal Testers" unless the TESTFLIGHT_GROUP repository variable says otherwise).
#
# Repository secrets (Settings → Secrets and variables → Actions), from an App Store Connect API key with the
# Admin role (Users and Access → Integrations → Team Keys); Admin is needed for cloud-managed signing:
#   ASC_KEY_ID       the key's ID
#   ASC_ISSUER_ID    the issuer ID shown above the list of keys
#   ASC_PRIVATE_KEY  the full contents of the downloaded AuthKey_XXXXXXXXXX.p8 file
name: App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, 'ios/**', .github/workflows/app-store.yml]

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Trim stray whitespace from pasted secrets, then make sure Apple accepts the key before spending time on a build.
      - name: Prepare the App Store Connect key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: ios/asc_key.sh

      - name: Check the App Store Connect key
        run: |
          "$RUNNER_TEMP/venv/bin/python" ios/check_asc_key.py "$RUNNER_TEMP/asc/AuthKey.p8"
          xcodebuild -version

      # Each upload needs a new build number; the workflow run number always goes up.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/CrabAttack.xcodeproj -scheme CrabAttack -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CrabAttack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CrabAttack.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  # Waiting for Apple to process the build takes 5–30 minutes and needs no Mac, so it runs on a cheaper Linux runner.
  testflight:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Internal group the build is added to; created on first use. Set the TESTFLIGHT_GROUP repository variable to change it.
      TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP || 'Internal Testers' }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare the App Store Connect key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: ios/asc_key.sh

      - name: Add the build to TestFlight internal testing
        run: '"$RUNNER_TEMP/venv/bin/python" ios/testflight.py "$RUNNER_TEMP/asc/AuthKey.p8" ${{ github.run_number }} "$TESTFLIGHT_GROUP"'

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
