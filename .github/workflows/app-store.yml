# Archives the iOS app on a GitHub-hosted Mac, signs it with cloud-managed certificates and uploads it to
# App Store Connect, so a release needs no Mac of your own. Runs on every push to main that changes the game
# or the iOS app, or by hand from the Actions tab (Run workflow).
#
# Repository secrets (Settings → Secrets and variables → Actions), from an App Store Connect API key with the
# Admin role (Users and Access → Integrations → Team Keys); Admin is needed for cloud-managed signing:
#   ASC_KEY_ID       the key's ID
#   ASC_ISSUER_ID    the issuer ID shown above the list of keys
#   ASC_PRIVATE_KEY  the full contents of the downloaded AuthKey_XXXXXXXXXX.p8 file
name: App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, 'ios/**', .github/workflows/app-store.yml]

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Trim stray whitespace from pasted secrets, then make sure Apple accepts the key before spending time on a build.
      - name: Check the App Store Connect key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Add the ASC_$name repository secret (see the top of this file)"; exit 1; fi
          done
          # The trimmed copies differ from the stored secrets, so GitHub would not hide them in logs on its own.
          key_id=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          issuer_id=$(printf '%s' "$ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$key_id"
          echo "::add-mask::$issuer_id"
          if ! [[ $key_id =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::ASC_KEY_ID should be the 10-character key ID from the .p8 file name (AuthKey_<KEY ID>.p8), not ${#key_id} characters. Was the private key pasted into it?"; exit 1
          fi
          if ! [[ $issuer_id =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::ASC_ISSUER_ID should look like 12345678-abcd-1234-abcd-123456789abc (copy it with the Copy button on the App Store Connect API page)."; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$issuer_id" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          ASC_KEY_ID="$key_id" ASC_ISSUER_ID="$issuer_id" "$RUNNER_TEMP/venv/bin/python" ios/check_asc_key.py "$RUNNER_TEMP/asc/AuthKey.p8"
          xcodebuild -version

      # Each upload needs a new build number; the workflow run number always goes up.
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/CrabAttack.xcodeproj -scheme CrabAttack -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/CrabAttack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CrabAttack.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect → TestFlight once processing finishes." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
