# Regenerate the Xcode project after editing this file: cd ios && xcodegen
name: CrabAttack
options:
  bundleIdPrefix: com.saucyfinn
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
targets:
  CrabAttack:
    type: application
    platform: iOS
    # Shared scheme, so command-line builds (the App Store workflow) can archive it.
    scheme: {}
    sources:
      - CrabAttack
      # The web game itself, bundled straight from the repo root so the app never runs a stale copy.
      - path: ../index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saucyfinn.CrabAttack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YBDN2BGLMW
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crab Attack
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # Uses no encryption beyond what iOS provides, which answers App Store Connect's export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
